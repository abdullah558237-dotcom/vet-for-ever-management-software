<!-- Mobile Offcanvas Menu (More Drawer) -->
<div class="offcanvas offcanvas-bottom rounded-top-4" tabindex="-1" id="mobileMenuOffcanvas" style="height: 50vh;">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold text-primary">
            <i class="bi bi-hospital me-2"></i> VetCare Pro Menu
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <div class="row g-2 text-center">
            <div class="col-4">
                <a href="/admin/" class="text-decoration-none text-dark d-block p-3 rounded-3 bg-light">
                    <i class="bi bi-gear-fill fs-2 text-primary"></i>
                    <div class="small fw-semibold mt-1">Admin</div>
                </a>
            </div>
            <div class="col-4">
                <a href="#" class="text-decoration-none text-dark d-block p-3 rounded-3 bg-light">
                    <i class="bi bi-capsule fs-2 text-success"></i>
                    <div class="small fw-semibold mt-1">Inventory</div>
                </a>
            </div>
            <div class="col-4">
                <a href="#" class="text-decoration-none text-dark d-block p-3 rounded-3 bg-light">
                    <i class="bi bi-shield-plus fs-2 text-danger"></i>
                    <div class="small fw-semibold mt-1">Vaccines</div>
                </a>
            </div>
            <div class="col-4">
                <a href="#" class="text-decoration-none text-dark d-block p-3 rounded-3 bg-light">
                    <i class="bi bi-bar-chart-fill fs-2 text-info"></i>
                    <div class="small fw-semibold mt-1">Reports</div>
                </a>
            </div>
            <div class="col-4">
                <a href="#" class="text-decoration-none text-dark d-block p-3 rounded-3 bg-light">
                    <i class="bi bi-person-circle fs-2 text-secondary"></i>
                    <div class="small fw-semibold mt-1">Profile</div>
                </a>
            </div>
            <div class="col-4">
                <form method="post" action="{% url 'logout' %}" class="h-100">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-light w-100 h-100 p-3 rounded-3 border-0">
                        <i class="bi bi-box-arrow-right fs-2 text-danger"></i>
                        <div class="small fw-semibold mt-1">Logout</div>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
