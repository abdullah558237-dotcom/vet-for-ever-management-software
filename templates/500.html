{% extends 'base.html' %}

{% block title %}Server Error | VetCare Pro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-12 col-md-6 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-octagon-fill" style="font-size: 4rem;"></i>
            </div>
            <h3 class="fw-bold text-dark">Internal Server Error (500)</h3>
            <p class="text-muted">A technical issue occurred while processing your clinical request. The error has been logged for review.</p>
            <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 fw-semibold rounded-3">
                Return to Safety
            </a>
        </div>
    </div>
</div>
{% endblock %}
